[workspace]
resolver = "3"
members = ["crates/*", "tests/counter/core", "tests/counter/c", "tests/counter/hl"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hx-n/hxn"

[workspace.dependencies]
hxn-abi = { path = "crates/hxn-abi" }
hxn-hl = { path = "crates/hxn-hl" }
hl_abi = { git = "https://github.com/rayzor-blade/hl_abi" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
