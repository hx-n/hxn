name: release

# Builds the `hxn` command for each platform and the `hxn` haxelib and, for a
# version tag, publishes the archives as the tag's GitHub release, with the
# tag's message as its notes, and submits the haxelib. Run by hand, it builds
# them and keeps them as the run's artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux binaries are static, so they run on any distribution.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, runs: true }
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, runs: true }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, runs: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        # The C runtime is linked statically on Windows, so the program needs
        # no Visual C++ redistributable.
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            export RUSTFLAGS="-C target-feature=+crt-static"
          fi
          cargo build --release --locked -p hxn-cli --target "${{ matrix.target }}"
      - name: Check that it runs
        if: matrix.runs
        shell: bash
        run: target/${{ matrix.target }}/release/hxn version
      - name: Package
        shell: bash
        run: |
          name="hxn-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "../target/${{ matrix.target }}/release/hxn.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp "../target/${{ matrix.target }}/release/hxn" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  # hxn's Haxe classes, which every packaged hxn library depends on.
  haxelib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        run: |
          version="$(jq -r .version haxelib.json)"
          crate="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "$version" = "$crate" ] || { echo "::error::haxelib.json is $version, the crates are $crate"; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::haxelib.json is $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "ZIP=hxn-haxelib-$version.zip" >> "$GITHUB_ENV"
      - run: zip -qr "$ZIP" haxelib.json haxe README.md LICENSE skills
      - uses: actions/upload-artifact@v4
        with:
          name: haxelib
          path: ${{ env.ZIP }}

  publish:
    needs: [build, haxelib]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum hxn-* > SHA256SUMS
          # The notes are the annotated tag's message, less its title line.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > ../notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "hxn ${GITHUB_REF_NAME#v}" --notes-file ../notes.md \
            hxn-* SHA256SUMS
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.6
      - name: Submit the haxelib
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: haxelib submit dist/hxn-haxelib-*.zip darmie "$HAXELIB_PASSWORD" --never < /dev/null
