name: site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - tests/site/**
      - examples/**
      - wrangler.jsonc
      - .github/workflows/site.yml
  pull_request:
    paths:
      - site/**
      - tests/site/**
      - examples/**
      - wrangler.jsonc
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check tutorial examples and navigation
        run: |
          python3 tests/site/check.py
          node --check site/script.js
      - name: Validate static deployment
        run: npx --yes wrangler@4.161.0 deploy --dry-run --outdir target/site-deploy
