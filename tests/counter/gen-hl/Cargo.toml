[package]
name = "counter-gen-hl"
description = "counter-core as HashLink primitives, using the adapter hxn-gen generates"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "counter_gen_hl"
# wasm-ld links the static library into a side module.
crate-type = ["cdylib", "staticlib"]
test = false
doctest = false

[dependencies]
counter-core = { path = "../core" }
hxn-abi = { workspace = true }
hxn-future = { workspace = true }
hxn-hl = { workspace = true }
hl_abi = { workspace = true }

[build-dependencies]
hxn-gen = { workspace = true }

[lints]
workspace = true
